<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>上海区级土地与楼宇概览</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      color: #17243a;
      background: #f4f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #718096;
      --line: #e5ebf3;
      --blue: #246bfd;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, select { font: inherit; }

    .page { max-width: 1440px; margin: 0 auto; padding: 28px 32px 32px; }
    .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 7px 0 6px; font-size: clamp(24px, 3vw, 34px); letter-spacing: -.04em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .demo-badge { flex: 0 0 auto; border: 1px solid #f0d7a1; border-radius: 999px; padding: 8px 12px; color: #805313; background: #fff8e8; font-size: 12px; font-weight: 700; }

    .layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(330px, .85fr); gap: 18px; align-items: stretch; }
    .card { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 8px 28px rgb(31 51 82 / 5%); }
    .map-card { min-height: 640px; display: flex; flex-direction: column; }
    .map-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .map-title { font-size: 14px; font-weight: 750; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .controls label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    select { max-width: 160px; border: 1px solid #dce4ef; border-radius: 8px; padding: 8px 28px 8px 10px; color: #25344a; background: #fff; font-size: 12px; }
    #map { flex: 1; min-height: 520px; background: #e9f0f6; }
    .map-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px; color: var(--muted); font-size: 11px; }
    .legend { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .gradient { width: 100px; height: 8px; border-radius: 99px; background: linear-gradient(90deg, #d9efff, #78b7ff, #246bfd); }

    .detail-card { padding: 20px; }
    .detail-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .detail-heading h2 { margin: 0; font-size: 21px; }
    .detail-hint { margin: 6px 0 18px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .district-code { color: #8a97a9; font-size: 11px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 10px 8px; color: #8390a3; font-size: 10px; font-weight: 700; line-height: 1.45; vertical-align: bottom; }
    td { padding: 12px 8px; border-top: 1px solid #edf1f6; color: #24334b; font-size: 12px; white-space: nowrap; }
    td:first-child { font-weight: 700; }
    td:last-child { color: #1d5de0; font-weight: 750; }
    .unit { display: block; color: #9aa5b4; font-size: 9px; font-weight: 500; }
    .district-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .summary-box { border-radius: 12px; padding: 13px; background: #f6f8fc; }
    .summary-box span { display: block; color: var(--muted); font-size: 11px; }
    .summary-box strong { display: block; margin-top: 7px; font-size: 17px; letter-spacing: -.02em; }
    .notice { margin-top: 16px; border-left: 3px solid #eab54d; padding: 9px 11px; color: #786342; background: #fffaf0; font-size: 11px; line-height: 1.55; }
    .status { margin-top: 9px; color: #728197; font-size: 11px; line-height: 1.5; }
    .status.error { color: #b42318; }
    .leaflet-tooltip.district-label { border: 0; padding: 2px 5px; color: #24334b; background: rgb(255 255 255 / 78%); box-shadow: none; font-size: 10px; font-weight: 700; }
    .leaflet-tooltip.district-label::before { display: none; }
    .leaflet-container { font-family: inherit; }

    @media (max-width: 900px) {
      .page { padding: 22px 16px; }
      .layout { grid-template-columns: 1fr; }
      .map-card { min-height: 540px; }
      #map { min-height: 440px; }
    }
    @media (max-width: 520px) {
      .header { display: block; }
      .demo-badge { display: inline-block; margin-top: 14px; }
      .map-toolbar { align-items: flex-start; flex-direction: column; }
      .controls { width: 100%; }
      .controls label { flex: 1; }
      .controls select { min-width: 0; width: 100%; }
      .map-footer { align-items: flex-start; flex-direction: column; }
      .detail-card { padding: 16px 12px; }
      td, th { padding-right: 5px; padding-left: 5px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <div class="eyebrow">Shanghai · District overview</div>
        <h1>上海区级土地与楼宇概览</h1>
        <p class="subtitle">悬停或点击地图中的区，查看工业厂房、商业楼宇和住房的示意数据。</p>
      </div>
      <span class="demo-badge">演示数据 · 非官方统计</span>
    </header>

    <section class="layout" aria-label="上海区级房产数据地图">
      <article class="card map-card">
        <div class="map-toolbar">
          <div class="map-title">区级分布</div>
          <div class="controls">
            <label>物业类型
              <select id="category">
                <option value="residential">住房</option>
                <option value="commercial">商业楼</option>
                <option value="industrial">工业厂房</option>
              </select>
            </label>
            <label>地图着色
              <select id="metric">
                <option value="totalValue">房屋估算总价</option>
                <option value="landPrice">土地参考单价</option>
                <option value="floorArea">楼房建筑面积</option>
              </select>
            </label>
          </div>
        </div>
        <div id="map" role="img" aria-label="上海市各区交互地图"></div>
        <div class="map-footer">
          <span id="legend-label">颜色越深，房屋估算总价越高</span>
          <span class="legend"><span>低</span><span class="gradient" aria-hidden="true"></span><span>高</span></span>
        </div>
      </article>

      <aside class="card detail-card" aria-live="polite">
        <div class="detail-heading">
          <div>
            <h2 id="district-name">上海市各区</h2>
            <p class="detail-hint" id="district-hint">将鼠标移到地图上的区，或点击区块固定查看。</p>
          </div>
          <span class="district-code" id="district-code"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>类型</th>
                <th>土地参考价<span class="unit">元/㎡</span></th>
                <th>建筑面积<span class="unit">万㎡</span></th>
                <th>房屋估值<span class="unit">亿元</span></th>
              </tr>
            </thead>
            <tbody id="detail-rows">
              <tr><td colspan="4">等待选择行政区…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="district-summary">
          <div class="summary-box"><span>三类物业建筑面积合计</span><strong id="total-area">—</strong></div>
          <div class="summary-box"><span>三类物业估值合计</span><strong id="total-value">—</strong></div>
        </div>
        <div class="notice">
          数据口径：页面中的数值均为构造的演示样例，不代表上海各区真实成交或官方统计。房屋估值按“建筑面积 × 示例物业均价”计算；土地价为示意单价，不等同于土地成交楼面价。
        </div>
        <div class="status" id="map-status">正在加载上海市区级边界…</div>
      </aside>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    // Each tuple is [illustrative land price (CNY/m²), building area (10,000 m²), property price (CNY/m²)].
    const districtData = {
      "黄浦区": { industrial: [7200, 42, 42000], commercial: [52000, 680, 68000], residential: [61000, 940, 112000] },
      "徐汇区": { industrial: [6500, 130, 25000], commercial: [39000, 760, 57000], residential: [48000, 1320, 98000] },
      "长宁区": { industrial: [6100, 76, 26000], commercial: [36000, 530, 52000], residential: [45000, 940, 91000] },
      "静安区": { industrial: [6700, 64, 29000], commercial: [44000, 790, 61000], residential: [52000, 1030, 105000] },
      "普陀区": { industrial: [5800, 170, 21000], commercial: [30000, 510, 41000], residential: [37000, 1150, 72000] },
      "虹口区": { industrial: [5900, 58, 23000], commercial: [33000, 390, 46000], residential: [40000, 750, 81000] },
      "杨浦区": { industrial: [5700, 180, 22000], commercial: [31000, 480, 45000], residential: [39000, 1070, 85000] },
      "闵行区": { industrial: [3900, 840, 13500], commercial: [19000, 860, 31000], residential: [26000, 2460, 57000] },
      "宝山区": { industrial: [3400, 920, 11000], commercial: [16000, 610, 26000], residential: [21000, 1830, 44000] },
      "嘉定区": { industrial: [3100, 1060, 10500], commercial: [15000, 680, 24000], residential: [19000, 1760, 39000] },
      "浦东新区": { industrial: [4300, 1980, 16500], commercial: [27000, 2260, 47000], residential: [35000, 5210, 76000] },
      "金山区": { industrial: [1800, 720, 7200], commercial: [8500, 280, 13000], residential: [10500, 840, 21000] },
      "松江区": { industrial: [2600, 790, 9200], commercial: [12500, 570, 21000], residential: [16500, 1540, 37000] },
      "青浦区": { industrial: [2700, 650, 9800], commercial: [14000, 530, 23000], residential: [18000, 1300, 41000] },
      "奉贤区": { industrial: [2100, 610, 7800], commercial: [9500, 390, 16000], residential: [12500, 980, 27000] },
      "崇明区": { industrial: [1300, 270, 5200], commercial: [5500, 160, 9000], residential: [7000, 460, 16000] }
    };

    const categoryNames = {
      industrial: "工业厂房",
      commercial: "商业楼",
      residential: "住房"
    };
    const metricNames = {
      landPrice: "土地参考单价",
      floorArea: "楼房建筑面积",
      totalValue: "房屋估算总价"
    };
    const map = L.map("map", { zoomControl: true, scrollWheelZoom: false });
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: "abcd",
      maxZoom: 19
    }).addTo(map);

    let boundaryLayer;
    let selectedName = "";
    const status = document.getElementById("map-status");
    const number = (value, digits = 0) => new Intl.NumberFormat("zh-CN", {
      maximumFractionDigits: digits,
      minimumFractionDigits: digits
    }).format(value);

    function getMetricValues(category, metric) {
      return Object.values(districtData)
        .map((district) => {
          const [landPrice, floorArea, propertyPrice] = district[category];
          if (metric === "landPrice") return landPrice;
          if (metric === "floorArea") return floorArea;
          return floorArea * propertyPrice / 10000;
        });
    }

    function featureMetric(feature) {
      const district = districtData[feature.properties.name];
      if (!district) return null;
      const [landPrice, floorArea, propertyPrice] = district[document.getElementById("category").value];
      const metric = document.getElementById("metric").value;
      if (metric === "landPrice") return landPrice;
      if (metric === "floorArea") return floorArea;
      return floorArea * propertyPrice / 10000;
    }

    function featureStyle(feature) {
      const value = featureMetric(feature);
      if (value === null) return { color: "#94a3b8", weight: 1, fillColor: "#cbd5e1", fillOpacity: 0.55 };
      const values = getMetricValues(document.getElementById("category").value, document.getElementById("metric").value);
      const low = Math.min(...values);
      const high = Math.max(...values);
      const ratio = high === low ? 0 : (value - low) / (high - low);
      const colors = ["#d9efff", "#9bcfff", "#5599f2", "#246bfd"];
      const color = colors[Math.min(colors.length - 1, Math.floor(ratio * colors.length))];
      return {
        color: feature.properties.name === selectedName ? "#173f89" : "#ffffff",
        weight: feature.properties.name === selectedName ? 3 : 1.4,
        fillColor: color,
        fillOpacity: 0.78
      };
    }

    function showDistrict(name, code) {
      const district = districtData[name];
      document.getElementById("district-name").textContent = district ? name : `${name}（暂无示例数据）`;
      document.getElementById("district-code").textContent = code ? `行政区划代码 ${code}` : "";
      document.getElementById("district-hint").textContent = district
        ? "下表展示该区三类物业的示意指标。"
        : "此行政区当前没有对应的演示数据。";
      const rows = document.getElementById("detail-rows");
      if (!district) {
        rows.innerHTML = '<tr><td colspan="4">暂无该区数据</td></tr>';
        document.getElementById("total-area").textContent = "—";
        document.getElementById("total-value").textContent = "—";
        return;
      }

      let areaTotal = 0;
      let valueTotal = 0;
      rows.innerHTML = Object.entries(categoryNames).map(([key, label]) => {
        const [landPrice, floorArea, propertyPrice] = district[key];
        const totalValue = floorArea * propertyPrice / 10000;
        areaTotal += floorArea;
        valueTotal += totalValue;
        return `<tr>
          <td>${label}</td>
          <td>${number(landPrice)}</td>
          <td>${number(floorArea)}</td>
          <td>${number(totalValue)}</td>
        </tr>`;
      }).join("");
      document.getElementById("total-area").textContent = `${number(areaTotal)} 万㎡`;
      document.getElementById("total-value").textContent = `${number(valueTotal)} 亿元`;
    }

    function refreshMap() {
      if (boundaryLayer) boundaryLayer.setStyle(featureStyle);
      const category = document.getElementById("category").value;
      const metric = document.getElementById("metric").value;
      const metricUnit = metric === "landPrice" ? "元/㎡" : metric === "floorArea" ? "万㎡" : "亿元";
      document.getElementById("legend-label").textContent =
        `颜色越深，${categoryNames[category]}${metricNames[metric]}越高（${metricUnit}）`;
    }

    function onEachDistrict(feature, layer) {
      const name = feature.properties.name;
      layer.bindTooltip(name, { permanent: true, direction: "center", className: "district-label" });
      layer.on({
        mouseover(event) {
          const target = event.target;
          target.setStyle({ color: "#173f89", weight: 3, fillOpacity: 0.95 });
          target.bringToFront();
          showDistrict(name, feature.properties.adcode);
        },
        mouseout(event) {
          boundaryLayer.resetStyle(event.target);
          if (!selectedName) {
            document.getElementById("district-name").textContent = "上海市各区";
            document.getElementById("district-hint").textContent = "将鼠标移到地图上的区，或点击区块固定查看。";
            document.getElementById("district-code").textContent = "";
          } else {
            const selectedFeature = boundaryLayer.getLayers().find(
              (item) => item.feature.properties.name === selectedName
            );
            if (selectedFeature) showDistrict(selectedName, selectedFeature.feature.properties.adcode);
          }
        },
        click() {
          selectedName = selectedName === name ? "" : name;
          refreshMap();
          showDistrict(name, feature.properties.adcode);
        }
      });
    }

    document.getElementById("category").addEventListener("change", refreshMap);
    document.getElementById("metric").addEventListener("change", refreshMap);

    if (typeof L === "undefined") {
      status.textContent = "地图组件加载失败。请检查网络连接后刷新页面。";
      status.classList.add("error");
    } else {
      fetch("https://geo.datav.aliyun.com/areas_v3/bound/310000_full.json")
        .then((response) => {
          if (!response.ok) throw new Error(`行政区边界请求失败（HTTP ${response.status}）`);
          return response.json();
        })
        .then((geojson) => {
          boundaryLayer = L.geoJSON(geojson, {
            style: featureStyle,
            onEachFeature: onEachDistrict
          }).addTo(map);
          map.fitBounds(boundaryLayer.getBounds(), { padding: [18, 18] });
          const boundarySource = document.createElement("a");
          boundarySource.href = "https://datav.aliyun.com/portal/school/atlas/area_selector";
          boundarySource.target = "_blank";
          boundarySource.rel = "noreferrer";
          boundarySource.textContent = "阿里云 DataV";
          status.replaceChildren(
            document.createTextNode(`已载入 ${geojson.features.length} 个区级边界。行政区边界：`),
            boundarySource,
            document.createTextNode("。地图资源需联网加载。")
          );
        })
        .catch((error) => {
          status.textContent = `区级边界加载失败：${error.message}。请检查网络连接或数据服务后刷新。`;
          status.classList.add("error");
          console.error("上海市区级地图加载失败：", error);
        });
    }
  </script>
</body>
</html>
